<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="930" viewBox="0 0 1280 930" role="img" aria-labelledby="title desc">
  <title id="title">Steering Turret Control software architecture</title>
  <desc id="desc">A control client communicates with the runtime over TCP. Separate UDP threads return telemetry. The motion worker uses a common motion interface to select either the physical CAN backend or the software simulator. The physical backend routes each axis to the Nanotec PD4-C CANopen library or the MYACTUATOR vendor CAN library.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#5f7898"/></marker>
  </defs>
  <rect width="1280" height="930" rx="20" fill="#f4f7fb"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="40" y="48" font-size="15" font-weight="700" letter-spacing="2" fill="#536f90">STEERING TURRET CONTROL</text>
    <text x="40" y="88" font-size="30" font-weight="700" fill="#142b45">One motion interface. Hardware or simulation.</text>
    <text x="40" y="118" font-size="17" fill="#53677e">Network communication, motion work, and telemetry have separate responsibilities.</text>

    <rect x="40" y="165" width="230" height="118" rx="12" fill="white" stroke="#c9d5e3" stroke-width="2"/>
    <text x="60" y="203" font-size="21" font-weight="700" fill="#142b45">Control client</text>
    <text x="60" y="234" font-size="17" fill="#53677e">Qt console or CLI</text>
    <text x="60" y="262" font-size="16" fill="#53677e">Commands and responses</text>

    <rect x="360" y="165" width="420" height="118" rx="12" fill="#142b45"/>
    <text x="382" y="203" font-size="21" font-weight="700" fill="white">C / C++ runtime</text>
    <text x="382" y="234" font-size="17" fill="#d3dfeb">Binary codec · state checks · limits</text>
    <text x="382" y="262" font-size="17" fill="#d3dfeb">Action queue · shared snapshots</text>

    <rect x="890" y="165" width="350" height="118" rx="12" fill="white" stroke="#c9d5e3" stroke-width="2"/>
    <text x="912" y="203" font-size="21" font-weight="700" fill="#142b45">Motion worker</text>
    <text x="912" y="234" font-size="17" fill="#53677e">Owns the selected backend</text>
    <text x="912" y="262" font-size="17" fill="#53677e">Orders motion and stop work</text>

    <path d="M280 224H350" stroke="#5f7898" stroke-width="2.5" fill="none" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="315" y="207" text-anchor="middle" font-size="15" fill="#53677e">TCP</text>
    <path d="M780 224H880" stroke="#5f7898" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <rect x="360" y="345" width="420" height="118" rx="12" fill="white" stroke="#c9d5e3" stroke-width="2"/>
    <text x="382" y="381" font-size="21" font-weight="700" fill="#142b45">Telemetry threads</text>
    <text x="382" y="412" font-size="17" fill="#53677e">Motion feedback · 100 Hz default</text>
    <text x="382" y="441" font-size="17" fill="#53677e">Health and state · 10 Hz default</text>
    <path d="M570 283V335" stroke="#5f7898" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M360 404H155V293" stroke="#5f7898" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <text x="174" y="390" font-size="15" fill="#53677e">UDP telemetry</text>

    <rect x="890" y="345" width="350" height="118" rx="12" fill="#e7ecf6" stroke="#b8c6df" stroke-width="2"/>
    <text x="912" y="381" font-size="21" font-weight="700" fill="#142b45">Shared motion interface</text>
    <text x="912" y="412" font-size="17" fill="#53677e">Move · speed · stop · feedback</text>
    <text x="912" y="441" font-size="16" fill="#53677e">motion_backend.h / router</text>
    <path d="M1065 283V335" stroke="#5f7898" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>

    <path d="M1065 463V510H430V562" stroke="#5f7898" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M1065 510V562" stroke="#5f7898" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <circle cx="1065" cy="510" r="4" fill="#5f7898"/>
    <text x="745" y="499" text-anchor="middle" font-size="16" font-weight="700" fill="#53677e">Select runtime backend</text>
    <text x="448" y="550" font-size="15" fill="#53677e">Hardware</text>
    <text x="1083" y="550" font-size="15" fill="#53677e">Simulation</text>

    <rect x="40" y="572" width="780" height="318" rx="14" fill="#e2eef5" stroke="#adc5d5" stroke-width="2"/>
    <text x="64" y="610" font-size="23" font-weight="700" fill="#142b45">Physical CAN backend</text>
    <text x="64" y="640" font-size="17" fill="#3f6079">Per-axis driver selection routes work to the matching motor library.</text>
    <path d="M430 652V670H230V686" stroke="#5f7898" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <path d="M430 670H615V686" stroke="#5f7898" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
    <circle cx="430" cy="670" r="4" fill="#5f7898"/>

    <rect x="64" y="696" width="332" height="142" rx="12" fill="white" stroke="#adc5d5" stroke-width="1.5"/>
    <text x="84" y="731" font-size="21" font-weight="700" fill="#142b45">Nanotec PD4-C</text>
    <text x="84" y="762" font-size="17" fill="#3f6079">CANopen / CiA 402</text>
    <text x="84" y="792" font-size="16" fill="#53677e">can_backend.c · pd4c.c</text>
    <text x="84" y="819" font-size="16" fill="#53677e">SocketCAN transport</text>

    <rect x="436" y="696" width="360" height="142" rx="12" fill="white" stroke="#adc5d5" stroke-width="1.5"/>
    <text x="456" y="731" font-size="21" font-weight="700" fill="#142b45">MYACTUATOR X8-25</text>
    <text x="456" y="762" font-size="17" fill="#3f6079">Vendor CAN protocol</text>
    <text x="456" y="792" font-size="16" fill="#53677e">myact_backend.c · x8_25.c</text>
    <text x="456" y="819" font-size="16" fill="#53677e">myact_socketcan.c transport</text>

    <rect x="890" y="572" width="350" height="196" rx="14" fill="#e8f0e7" stroke="#b5c9b0" stroke-width="2"/>
    <text x="912" y="610" font-size="23" font-weight="700" fill="#142b45">Software simulator</text>
    <text x="912" y="646" font-size="17" fill="#53677e">C++ motor model</text>
    <text x="912" y="677" font-size="17" fill="#53677e">Functional checks without motors</text>
    <text x="912" y="712" font-size="16" fill="#53677e">sim_api.cpp · sim_backend.cpp</text>
  </g>
</svg>
