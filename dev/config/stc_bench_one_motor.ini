# ALMA SISTEMI SRL - Steering Turret Control (STC)
#
# Property of ALMA SISTEMI SRL.
# This file is part of the STC development codebase.
# Documentation/comment ownership header only; no runtime behavior changes.

# Minimal single-motor bench configuration for node_id=1.
# Intended for first PD4-C/PD6-C CAN bring-up and validation before using
# the full 18-axis deployment file.

[Network]
# Command and telemetry transport settings used by bench tests.
tcp_port = 7000
tlm_dest_ip = 127.0.0.1
tlmh_port = 6010
tlml_port = 6020
tlmh_interval_ms = 10
tlml_interval_ms = 100
can_scan_max_node = 1

[Axis0]
# Single enabled axis with conservative turret-like limits.
enabled = true
driver = pd4c
node_id = 1
counts_per_rev = 4096
gear_ratio = 100
min_deg = -140
max_deg = 140
max_speed_deg_s = 45
storage_deg = 0
pp_profile_vel = 500
diag_cat = 0x06
diag_subcat = 0x3F


[Turret]
# Logical mapping for turret commands in one-axis bench mode.
az_axis = 0
el_axis = -1

[Mirror1]
# Optional mirror path mapped to the same physical bench axis.
axis = 0

[diagnostics]
# Placeholder for bench-specific diagnostic overrides.
