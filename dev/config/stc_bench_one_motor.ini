# ALMA SISTEMI SRL - Steering Turret Control (STC)

[Network]
tcp_port = 7000
tlm_dest_ip = 127.0.0.1
tlmh_port = 6010
tlml_port = 6020
tlmh_interval_ms = 10
tlml_interval_ms = 100
can_scan_max_node = 1

[Axis0]
enabled = true
driver = myact_x8_25
node_id = 1
counts_per_rev = 36000
gear_ratio = 9
min_deg = -90
max_deg = 90
max_speed_deg_s = 110
storage_deg = 0
pp_profile_vel = 500
diag_cat = 0x06
diag_subcat = 0x3F

[Turret]
# Bench one-motor setup: turret axes intentionally unmapped.
az_axis = -1
el_axis = -1

[Mirror1]
# Axis0 is mapped as Mirror1 only.
axis = 0

[diagnostics]
