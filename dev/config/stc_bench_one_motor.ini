# Minimal bench config for single motor (node_id=1)

[Network]
tcp_port = 7000
tlm_dest_ip = 127.0.0.1
tlmh_port = 6010
tlml_port = 6020
tlmh_interval_ms = 10
tlml_interval_ms = 100
can_scan_max_node = 1

[Axis0]
enabled = true
driver = pd4c
node_id = 1
counts_per_rev = 4096
gear_ratio = 100
min_deg = -140
max_deg = 140
max_speed_deg_s = 45
storage_deg = 0
pp_profile_vel = 500
diag_cat = 0x06
diag_subcat = 0x3F


[Turret]
az_axis = 0
el_axis = -1

[Mirror1]
axis = 0

[diagnostics]
motor_status_map = 0,-1,-1,-1,-1,-1,-1,-1
