# ALMA SISTEMI SRL - Steering Turret Control (STC)
#
# Property of ALMA SISTEMI SRL.
# This file is part of the STC development codebase.
#
# File purpose:
#   One-axis X8-25 bench configuration used for safe bring-up and ICD integration.
#
# Design notes:
#   Maps exactly one MYACTUATOR mirror axis on SocketCAN (can0).
#   Keeps driver/node/mapping keys explicit so server, GUI, CLI, and telemetry agree.
#   Enables active status streaming and feedback timeout for bench observability.
#   Startup-only profile; modify limits/node IDs only when hardware mapping is verified.

[Network]
tcp_port=7000
tlmh_ip=127.0.0.1
tlmh_port=6010
tlmh_hz=100
tlml_ip=127.0.0.1
tlml_port=6020
tlml_hz=10

[CAN]
ifname=can0
bitrate=1000
restart_ms=100

[Runtime]
backend=can
allow_degraded_startup=false
require_identity_for_pbit=0
rt_enabled=0
rt_strict=0
strict_stale_policy=0
startup_feedback_grace_ms=3000
speed_watchdog_ms=2000
speed_stream_period_ms=50

[Axis0]
enabled=true
name=bench_x8_25
driver=myact_x8_25
# driver=pd4c
node_id=1
role=mirror1
counts_per_rev=36000
gear_ratio=9
min_deg=-90
max_deg=90
max_speed_deg_s=110
pp_profile_vel_deg_s=50
storage_deg=0.0
command_sign=1.0
telemetry_sign=1.0
zero_on_start=true
zero_physical_deg=0.0
brake_release_timeout_ms=3000
brake_poll_ms=50
active_status2_enable=true
active_status2_interval_ms=50
feedback_timeout_ms=1000
diag_cat=0x06
diag_subcat=0x3F

[Turret]
az_axis=-1
el_axis=-1

[Mirror1]
axis=0

[SUT]
count=0

[SUT1]
az_axis=-1
el_axis=-1
mirror_axis=-1

[diagnostics]
