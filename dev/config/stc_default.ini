# ALMA SISTEMI SRL - Steering Turret Control (STC)
#
# Property of ALMA SISTEMI SRL.
# This file is part of the STC development codebase.
# Documentation/comment ownership header only; no runtime behavior changes.

# Full 18-axis default runtime configuration for stc_server.
# Used for integrated turret + 8xSUT + 8xmirror logical deployments.
# WARNING: with USE_SIMULATOR=OFF, node_id assignments and mechanical limits
# must match real hardware before enabling motion.

[Network]
# TCP CMD/RSP listen port for command/control clients.
tcp_port = 7000
# UDP fallback telemetry destination IP used by TLMH/TLML transmitters.
tlm_dest_ip = 127.0.0.1
# TLMH/TLML UDP ports and publish intervals.
tlmh_port = 6010
tlml_port = 6020
tlmh_interval_ms = 10
tlml_interval_ms = 100
# Stale CAN timeout policy: age threshold and strict fail behavior toggle.
can_timeout_ms = 1000
strict_stale_policy = 0

[Runtime]
backend=can
# Startup grace period before stale-feedback checks become fault-eligible.
startup_feedback_grace_ms=3000

# AxisN sections define hardware/protocol parameters:
# - node_id: CANopen node address.
# - counts_per_rev + gear_ratio: encoder/mechanical conversion.
# - min_deg/max_deg/max_speed_deg_s/storage_deg: command limits and stow target.
# - pp_profile_vel: DS402 Profile Position velocity object value.
# - diag_cat/diag_subcat: encoded diagnostic routing metadata.
[Axis0]
enabled = true
driver = pd4c
node_id = 1
counts_per_rev = 4096
gear_ratio = 100
min_deg = -140
max_deg = 140
max_speed_deg_s = 45
storage_deg = 0
pp_profile_vel = 500
diag_cat = 0x06
diag_subcat = 0x3F

