# Steering Turret Control (STC)
#
# This file is part of the STC development codebase.
#
# File purpose:
#   axis limit and dynamics configuration for legacy stub motor models.
#
# Design notes:
#   startup-only mechanical model data; use full-line comments above keys rather than editing value lines.
#   Values are interpreted as degrees, deg/s, deg/s^2, and representative gear ratio scalars.
#   Keep per-axis limits deterministic for protocol and bench simulation comparability.

# Simulated motor parameters for stub_ST actuator model.
# Used by the C++ simulator to constrain commanded motion per logical axis role.
# Per-section limits: min/max angle (deg), max velocity (deg/s),
# max acceleration (deg/s^2), and representative gear_ratio.

[ST_AZ]
# Turret azimuth simulated actuator limits.
min = -140
max = 140
max_velocity = 45
max_acceleration = 90
gear_ratio = 100

[ST_EL]
# Turret elevation simulated actuator limits.
min = -5
max = 180
max_velocity = 45
max_acceleration = 90
gear_ratio = 20

