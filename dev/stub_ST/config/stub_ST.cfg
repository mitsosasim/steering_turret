# Steering Turret Control (STC)
#
# This file is part of the STC development codebase.
#
# File purpose:
#   configuration for the legacy ST stub process.
#
# Design notes:
#   startup-only simulator settings; keep value lines unchanged in comment-only patches.
#   Socket ports and telemetry intervals are consumed by stub_ST at process bootstrap.
#   Use full-line comments above keys to avoid parser differences on inline tails.

# Communication parameters for the C++ stub simulator (st_com::Config).
# Used when stub_ST emulates command ingress plus TLMH/TLML telemetry egress.
# Allowed section names: [ST_COM] or [Config].

[ST_COM]
# TCP command listen port and telemetry UDP endpoint ports.
listen_cmd_port = 7000
telemetry_h_port = 6010
telemetry_l_port = 6020
# Telemetry publish intervals in milliseconds for high/low-rate channels.
telemetry_h_interval_ms = 5
telemetry_l_interval_ms = 100
